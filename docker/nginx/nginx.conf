# StackLeo Tech Store — reverse proxy reference configuration
#
# Fronts all three services behind one nginx entrypoint, routed by
# subdomain (the standard pattern for a Next.js storefront + admin
# dashboard + API living behind one edge) — replace the placeholder
# `*.stackleo.example` domains with the real ones before deploying.
#
# Every `proxy_pass` target uses a `set $upstream ...` variable rather
# than a bare hostname. That's deliberate: nginx resolves a *variable*
# hostname per-request (bounded by the `resolver ... valid=` TTL), but
# caches a *literal* hostname's resolution once, at config load. Docker's
# embedded DNS (127.0.0.11) returns every matching container as a
# round-robin A record set, so scaling a service — e.g.
# `docker compose -f docker-compose.yml -f docker-compose.production.yml
# up -d --scale api=3` — is picked up automatically and load-balanced
# across replicas without an nginx reload. A bare `proxy_pass http://api:4000;`
# would silently keep hitting whichever single replica existed when
# nginx started.
#
# TLS is intentionally not configured here — see
# docs/11_Deployment_DevOps/environments.md for why (cloud-specific
# certificate provisioning is out of scope for this foundation) and
# where a certbot/ACME sidecar would plug in later.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  server {
    listen 80;
    server_name stackleo.example;

    location / {
      set $upstream web:3000;
      proxy_pass http://$upstream;
    }
  }

  server {
    listen 80;
    server_name admin.stackleo.example;

    location / {
      set $upstream admin:3000;
      proxy_pass http://$upstream;
    }
  }

  server {
    listen 80;
    server_name api.stackleo.example;

    location / {
      set $upstream api:4000;
      proxy_pass http://$upstream;
    }
  }
}
